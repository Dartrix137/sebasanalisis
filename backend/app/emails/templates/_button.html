{% macro button(url, label) %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td style="background:#e0b341;border-radius:8px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:bold;color:#1a1405;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 12px 0;font-size:13px;color:#8b98ae;">
  Si el botón no funciona, copia y pega este enlace en tu navegador:<br>
  <span style="word-break:break-all;color:#d7deea;">{{ url }}</span>
</p>
{% endmacro %}
